spring.application.name=transporte
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/transporte}
spring.datasource.username=${DATABASE_USER:transporte}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
transporte.seguridad.admin.usuario=${TRANSPORTE_ADMIN_USUARIO:admin}
transporte.seguridad.admin.clave=${TRANSPORTE_ADMIN_CLAVE}
transporte.seguridad.operacion.usuario=${TRANSPORTE_OPERACION_USUARIO:operacion}
transporte.seguridad.operacion.clave=${TRANSPORTE_OPERACION_CLAVE}
spring.mail.host=${MAIL_HOST:127.0.0.1}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=1500
spring.mail.properties.mail.smtp.timeout=1500
spring.mail.properties.mail.smtp.writetimeout=1500
transporte.correo.remitente=${MAIL_FROM:avisos@transporte.local}
